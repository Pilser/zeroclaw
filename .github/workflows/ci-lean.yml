name: Lean CI — check only while stripping

on:
  push:
    branches: [master, feat/*, lean/*]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: fmt
        run: cargo fmt --all -- --check

      - name: cargo check (lean)
        run: cargo check --locked --no-default-features --features lean

